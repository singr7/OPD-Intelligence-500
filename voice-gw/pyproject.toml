[project]
name = "opd-voice-gw"
version = "0.1.0"
description = "OPD Intelligence Platform — telephony audio websocket gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The call driver + engine are async (S14). Same knobs as the backend so a bare
# `pytest` and `make test-voicegw` behave identically.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# S15's receptionist tests hold a session-scoped Postgres engine, and asyncpg
# connections belong to the loop that opened them — a per-test loop would see
# "attached to a different loop". Same pair of knobs as the backend.
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
