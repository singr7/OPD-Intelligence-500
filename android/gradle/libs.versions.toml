## Dependency budget (doc 03 §1c.7: "<15MB, offline-first, Android 8+")
##
## Every line here costs APK bytes on a phone that may have 8GB of storage
## total, so the list is short on purpose:
##
## * **No Hilt / Dagger.** DI is one hand-written `AppContainer` (`OpdApp.kt`).
##   Compile-time DI earns its keep in a 40-module app; here it would add a
##   processor, a plugin and ~200KB to save writing thirty lines.
## * **No Retrofit / Moshi / Gson.** OkHttp + kotlinx.serialization is the same
##   job with one reflection-free serializer we already need for Room's payloads.
## * **No image loader.** The only remote images are report photos, which the
##   phone stores itself.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
work = "2.10.0"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
testRunner = "1.6.2"
