[project]
name = "opd-backend"
version = "0.1.0"
description = "OPD Intelligence Platform — FastAPI backend (api service)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # FastAPI multipart form/file uploads (kiosk /stt)
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    # S-GL.1: Fernet, for the vendor credentials the admin console stores. The one
    # place this codebase keeps a secret in its own database, so the primitive is
    # a reviewed one rather than something assembled out of hashlib.
    "cryptography>=44.0",
    "faker>=33.1",
    "pyyaml>=6.0",
    "redis>=5.2",
    # Shared HTML -> PDF renderer for authenticated prescriptions. Pango and
    # HarfBuzz provide Indic shaping; keep this exact version in sync with
    # requirements.txt and the backend image.
    "weasyprint==68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pypdf>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped loop for both fixtures and tests: the DB engine is built once
# per session, and an engine outliving the loop it was created on raises
# "Event loop is closed" on the second test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
