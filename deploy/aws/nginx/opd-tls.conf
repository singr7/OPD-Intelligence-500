map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone $binary_remote_addr zone=opd_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name AWS_HOSTNAME;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name AWS_HOSTNAME;

    ssl_certificate /etc/letsencrypt/live/AWS_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AWS_HOSTNAME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This file is installed only after the certificate and HTTPS health gate pass.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    location = /api/auth/otp/request {
        limit_req zone=opd_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:18080/auth/otp/request;
        include /etc/nginx/opd-proxy.conf;
    }

    location = /api/auth/otp/verify {
        limit_req zone=opd_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:18080/auth/otp/verify;
        include /etc/nginx/opd-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080/;
        include /etc/nginx/opd-proxy.conf;
    }

    location /queue/ws {
        proxy_pass http://127.0.0.1:18080/queue/ws;
        include /etc/nginx/opd-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /exotel/ {
        proxy_pass http://127.0.0.1:18081/exotel/;
        include /etc/nginx/opd-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ~ ^/downloads/(opd-patient-[0-9][0-9A-Za-z._-]*\.(apk|json|sha256))$ {
        alias /data/releases/$1;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
            text/plain sha256;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/downloads/(opd-patient-latest\.(apk|json|sha256))$ {
        alias /data/releases/$1;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
            text/plain sha256;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        include /etc/nginx/opd-proxy.conf;
    }
}
